<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Turnly</title>
  <style>
    :root {
      --surface: #202124;
      --raised: #2d2e31;
      --line: #3c4043;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --green: #81c995;
      --green-strong: #1e8e3e;
      --focus: #8ab4f8;
    }

    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      background: var(--surface);
      color: var(--text);
      font: 13px/1.45 "Google Sans", Roboto, system-ui, sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    header img {
      width: 28px;
      height: 28px;
    }

    h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 500;
    }

    .tagline {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .card {
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--raised);
    }

    .code {
      display: inline-block;
      margin-bottom: 10px;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--surface);
      color: var(--muted);
      font: 12px/1.6 ui-monospace, "SF Mono", Menlo, monospace;
      letter-spacing: 0.02em;
    }

    label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
      cursor: pointer;
    }

    .switch {
      position: relative;
      flex: none;
      width: 36px;
      height: 20px;
      margin: 0;
      border-radius: 10px;
      background: var(--line);
      appearance: none;
      cursor: pointer;
      transition: background-color 150ms;
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--muted);
      transition: transform 150ms, background-color 150ms;
    }

    .switch:checked {
      background: var(--green-strong);
    }

    .switch:checked::after {
      background: #fff;
      transform: translateX(16px);
    }

    .switch:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .status {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 12px 0 0;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    .dot {
      flex: none;
      width: 8px;
      height: 8px;
      margin-top: 5px;
      border-radius: 50%;
      background: var(--muted);
    }

    .status.is-live .dot {
      background: var(--green);
      box-shadow: 0 0 0 3px rgb(129 201 149 / 20%);
    }

    .outside {
      margin: 0;
      color: var(--muted);
    }

    @media (prefers-reduced-motion: reduce) {
      .switch,
      .switch::after {
        transition: none;
      }
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <header>
    <img src="../icons/icon-32.png" alt="">
    <div>
      <h1>Turnly</h1>
      <p class="tagline">Who's next in your stand-up</p>
    </div>
  </header>

  <section class="card meeting" hidden>
    <span class="code"></span>
    <label>
      <span>Show Turnly here</span>
      <input class="switch" type="checkbox" role="switch">
    </label>
    <p class="status" aria-live="polite"><span class="dot"></span><span class="status-text"></span></p>
  </section>

  <p class="card outside" hidden>Open a Google Meet call, then turn Turnly on for it here. It remembers your choice for that meeting link.</p>

  <script src="popup.js" type="module"></script>
</body>
</html>
